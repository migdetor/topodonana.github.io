<!DOCTYPE html>
<html>
<head>
  <title>Leaflet Preview</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    body { margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    // 1) Mapa: zoom inicial 11, limitado a 11–13
    var map = L.map('map', {
      attributionControl: false,
      zoom: 11,
      minZoom: 3,
      maxZoom: 13
    }).setView([36.97270521648507, -6.41201734], 11);

    L.control.attribution({ prefix: false }).addTo(map);

    // 2) Basemap 1: OSM (abajo, como alternativa)
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    // 3) Basemap 2: Satélite (Esri) (por defecto)
    var esriSat = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri'
      }
    );

    // Activa por defecto el satélite (si prefieres OSM por defecto, cambia esto a osm.addTo(map);)
    esriSat.addTo(map);

    // 4) Tu mapa (overlay) arriba de todo
    var topoDonana = L.tileLayer('tiles/{z}/{x}/{y}.png', {
      minZoom: 3,
      maxZoom: 13,
      tms: false,
      opacity: 0.9,
      attribution: 'Created by QGIS algorithm: Generar teselas XYZ (Directorio)'
    }).addTo(map);

    // 5) Control de capas
    var baseLayers = {
      "OpenStreetMap": osm,
      "Satélite": esriSat
    };

    var overlays = {
      "Mapa actualizado de Doñana": topoDonana
    };

    L.control.layers(baseLayers, overlays, { collapsed: false }).addTo(map);
  </script>
</body>
</html>
